<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>main-struggle</title>

    <style>
      body {
        background-size: cover;
        margin: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu,
          Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      code {
        font-family:
          source-code-pro, Menlo, Monaco, Consolas, "Courier New", monospace;
      }
    </style>

    <script>
      (function () {
        try {
          var store = localStorage.getItem("theme-store");
          // Default to 'theme' (your favorite) if they haven't visited before
          var theme = store ? JSON.parse(store).state.theme : "theme";

          if (theme === "oled") {
            document.documentElement.classList.add("dark");
            document.documentElement.setAttribute("data-theme", "oled");
          } else if (theme === "theme") {
            document.documentElement.classList.add("dark");
            document.documentElement.removeAttribute("data-theme");
          } else {
            document.documentElement.classList.add("light");
            document.documentElement.removeAttribute("data-theme");
          }
        } catch (e) {
          console.error("Theme script failed to load:", e);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
